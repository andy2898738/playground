<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>遊戲世界大樓 — 雲端金幣與外觀大廳</title>
  <style>
    :root {
      --bg-sky: linear-gradient(180deg, #090d1f 0%, #141c3b 55%, #1f2954 100%);
      --panel-bg: rgba(18, 25, 52, 0.9);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text-main: #f5f7ff;
      --text-sub: #a8b4d8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --wall-bg: #1b2444;
      --window-lit: #fde68a;
      --window-dim: #2b3864;
    }

    body.day-mode {
      --bg-sky: linear-gradient(180deg, #60a5fa 0%, #bae6fd 65%, #e0f2fe 100%);
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(15, 23, 42, 0.12);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0284c7;
      --gold: #d97706;
      --wall-bg: #cbd5e1;
      --window-lit: #fef08a;
      --window-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "PingFang TC", system-ui, -apple-system, sans-serif;
    }

    html {
      font-size: clamp(14px, 0.9vw + 10px, 17px);
    }

    body {
      min-height: 100dvh;
      background: var(--bg-sky);
      color: var(--text-main);
      transition: background 0.4s ease, color 0.3s ease;
      padding: clamp(10px, 2vw, 24px);
      overflow-x: hidden;
    }

    .topbar {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto clamp(12px, 2vw, 20px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: clamp(10px, 1.5vw, 16px) clamp(14px, 2vw, 22px);
    }

    .brand {
      min-width: 0;
      flex: 1 1 220px;
    }

    .brand h1 {
      font-size: clamp(1.1rem, 1.5vw, 1.4rem);
      letter-spacing: 0.04em;
      line-height: 1.25;
    }

    .brand p {
      font-size: clamp(0.78rem, 0.95vw, 0.88rem);
      color: var(--text-sub);
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }

    .status-pill.offline {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .player-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 2px solid var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-main);
      max-width: 180px;
    }

    .player-badge span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-badge.frame-gold {
      border-color: #fbbf24;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.45);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(245, 158, 11, 0.08));
    }

    .player-badge.frame-neon {
      border-color: #e879f9;
      box-shadow: 0 0 14px rgba(232, 121, 249, 0.45);
      background: linear-gradient(135deg, rgba(232, 121, 249, 0.22), rgba(56, 189, 248, 0.12));
    }

    .coin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.16);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: var(--gold);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .coin-badge.bump {
      transform: scale(1.1);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 8px 13px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.22);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #eab308);
      color: #0f172a;
    }

    .main-grid {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: clamp(14px, 2vw, 24px);
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* 大樓與景觀電梯區 */
    .tower-wrapper {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: clamp(12px, 1.8vw, 20px);
      min-width: 0;
    }

    .tower-wrapper.festive {
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.28);
      border-color: rgba(251, 191, 36, 0.55);
    }

    .tower-roof {
      text-align: center;
      background: linear-gradient(90deg, #334155, #1e293b);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 14px 14px 4px 4px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .tower-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(58px, 8vw, 82px);
      gap: 10px;
      background: var(--wall-bg);
      padding: clamp(8px, 1.2vw, 12px);
      border-radius: 12px;
      align-items: stretch;
    }

    .floors-column {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      min-width: 0;
    }

    .floor-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: clamp(9px, 1.2vw, 13px) clamp(10px, 1.4vw, 15px);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      min-height: 58px;
      transition: all 0.2s ease;
    }

    body.day-mode .floor-row {
      background: rgba(255, 255, 255, 0.72);
      border-color: rgba(15, 23, 42, 0.12);
    }

    .floor-row.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }

    .floor-row.floor2-gold {
      border-color: #fbbf24;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.22), rgba(15, 23, 42, 0.38));
    }

    .floor-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .floor-left > div {
      min-width: 0;
    }

    .floor-tag {
      font-weight: 800;
      font-size: 0.92rem;
      min-width: 32px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .floor-title {
      font-weight: 700;
      font-size: 0.96rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .floor-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .windows {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .win {
      width: 12px;
      height: 18px;
      border-radius: 3px;
      background: var(--window-dim);
    }

    .win.lit {
      background: var(--window-lit);
      box-shadow: 0 0 8px rgba(253, 230, 138, 0.5);
    }

    @media (max-width: 520px) {
      .windows {
        display: none;
      }
    }

    /* 電梯井：完全依樓層百分比自動定位 */
    .elevator-shaft {
      position: relative;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      min-height: 100%;
    }

    .elevator-car {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 46px;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 800;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.45);
      transition: top 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 右側資訊面板 */
    .inspector {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: clamp(14px, 2vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 0.76rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .economy-box {
      background: rgba(15, 23, 42, 0.25);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 13px;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    body.day-mode .economy-box {
      background: rgba(241, 245, 249, 0.88);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-row > button {
      white-space: normal;
      text-align: center;
    }

    /* 彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 500px;
      background: #131c38;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 20px;
      max-height: 85dvh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .shop-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
    }

    .shop-item > div {
      flex: 1 1 200px;
      min-width: 0;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.84rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      margin: 10px 0 14px;
    }

    /* 電梯前往過場 */
    .elevator-transition {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 31, 0.95);
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      z-index: 100;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 700;
    }

    .elevator-transition.active {
      display: flex;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>🏢 遊戲世界大樓</h1>
      <p>跨樓層小遊戲大廳 · 賺金幣、付入場、挑外觀</p>
    </div>

    <div class="top-actions">
      <span id="cloudStatus" class="status-pill">● 雲端連線中</span>

      <button id="playerBadge" class="player-badge" onclick="openPlayerModal()" title="點擊切換玩家">
        <span>👤 <span id="playerNameLabel">andy</span></span>
      </button>

      <div id="coinBadge" class="coin-badge" onclick="openWalletModal()" title="查看金幣明細">
        <span>🪙 <span id="coinBalance">500</span></span>
      </div>

      <button class="btn-gold" onclick="openShopModal()">🎨 外觀商店</button>
      <button class="btn-secondary" onclick="toggleDayNight()">🌓 日夜切換</button>
    </div>
  </header>

  <main class="main-grid">
    <section id="towerWrapper" class="tower-wrapper">
      <div class="tower-roof">▲ ROOFTOP · 遊戲大樓觀景台 ▲</div>
      <div class="tower-body">
        <div id="floorsColumn" class="floors-column"></div>
        <div id="elevatorShaft" class="elevator-shaft">
          <div id="elevatorCar" class="elevator-car">
            <span>🛗</span>
            <span id="elevatorFloorText">2F</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <div>
        <div id="detailFloor" style="font-weight: 800; color: var(--accent); font-size: 0.95rem;">2F</div>
        <h2 id="detailTitle" style="font-size: clamp(1.25rem, 1.8vw, 1.55rem); margin-top: 2px;">拉密</h2>
      </div>

      <div id="detailTags" class="tags"></div>
      <p id="detailDesc" style="line-height: 1.65; color: var(--text-sub);"></p>

      <div id="detailEconomy" class="economy-box"></div>

      <div id="detailActions" class="action-row"></div>
    </aside>
  </main>

  <div id="elevatorOverlay" class="elevator-transition">
    <div>🛗 電梯前往 <span id="targetFloorLabel">2F</span> 中...</div>
    <div style="font-size: 0.9rem; color: #94a3b8;">正在準備遊戲畫面</div>
  </div>

  <div id="playerModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>切換／建立玩家代號</h3>
        <button class="btn-secondary" onclick="closeModal('playerModal')">✕</button>
      </div>
      <p style="font-size: 0.88rem; color: #cbd5e1;">輸入你的玩家代號（英數或暱稱），金幣與外觀會同步到你的 Firebase 帳號：</p>
      <input id="playerInput" type="text" placeholder="例如：andy" />
      <div class="action-row">
        <button class="btn-primary" onclick="savePlayerId()">確認切換</button>
      </div>
    </div>
  </div>

  <div id="shopModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🎨 大廳外觀商店</h3>
        <button class="btn-secondary" onclick="closeModal('shopModal')">✕</button>
      </div>
      <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 12px;">目前持有：🪙 <strong id="shopCoins">500</strong></p>
      <div id="shopList"></div>
    </div>
  </div>

  <div id="walletModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🪙 金幣金庫與收支明細</h3>
        <button class="btn-secondary" onclick="closeModal('walletModal')">✕</button>
      </div>
      <p style="margin-bottom: 12px;">目前餘額：<strong>🪙 <span id="walletCoins">500</span></strong></p>
      <div id="logList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfd5fw0jS1tDwpdUHwOUdxDKyXtHtG2fw",
      authDomain: "playground-e67f0.firebaseapp.com",
      projectId: "playground-e67f0",
      storageBucket: "playground-e67f0.firebasestorage.app",
      messagingSenderId: "135749339497",
      appId: "1:135749339497:web:5aeea99672c7ab30df55f8"
    };

    const FLOORS = [

        url: null,

      },
      {
        id: "2F",
        name: "拉密",

        desc: "在二樓的桌遊小館來場數字對決，動動腦筋找出最佳出牌組合。"

      {

        url: null,

      }
    ];

    const SHOP_ITEMS = [
      { id: "frame_gold", name: "金色榮耀名牌框", price: 150, type: "frame", cssClass: "frame-gold", desc: "讓你的頂部玩家名牌閃耀金光。" },
      { id: "frame_neon", name: "霓虹電玩名牌框", price: 250, type: "frame", cssClass: "frame-neon", desc: "充滿電玩城氛圍的紫粉霓虹邊框。" },
      { id: "floor2_gold", name: "2F 桌遊館金邊燈牌", price: 200, type: "floor2", desc: "為二樓《拉密》加上專屬金色邊框。" },
      { id: "festive_tower", name: "大樓慶典燈光特效", price: 300, type: "tower", desc: "讓整棟遊戲大樓外牆散發暖金光暈。" }
    ];

    let currentFloorId = "2F";
    let playerId = (localStorage.getItem("gameTower_playerId") || "andy").trim().toLowerCase();
    let playerData = {
      nickname: playerId,
      coins: 500,
      equippedFrame: "frame_default",
      ownedItems: ["frame_default"],
      logs: [{ floor: "1F", reason: "歡迎來到遊戲世界大樓", delta: 500, time: "初始" }]
    };

    let unsubscribeDoc = null;
    let db = null;
    let isOfflineMode = false;

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (err) {
      isOfflineMode = true;
      updateCloudStatus(false);
    }

    function updateCloudStatus(online) {
      const el = document.getElementById("cloudStatus");
      if (online) {
        el.textContent = "● 已連線雲端";
        el.classList.remove("offline");
      } else {
        el.textContent = "● 本機備援模式";
        el.classList.add("offline");
      }
    }

    function nowTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function loadLocalFallback() {
      const saved = localStorage.getItem(`tower_player_${playerId}`);
      if (saved) {
        playerData = JSON.parse(saved);
      } else {
        playerData = {
          nickname: playerId,
          coins: 500,
          equippedFrame: "frame_default",
          ownedItems: ["frame_default"],
          logs: [{ floor: "1F", reason: "新玩家初始金幣", delta: 500, time: nowTime() }]
        };
      }
      renderAll();
    }

    function saveLocalFallback() {
      localStorage.setItem(`tower_player_${playerId}`, JSON.stringify(playerData));
    }

    function subscribePlayer() {
      document.getElementById("playerNameLabel").textContent = playerId;
      if (unsubscribeDoc) {
        unsubscribeDoc();
        unsubscribeDoc = null;
      }
      if (!db || isOfflineMode) {
        loadLocalFallback();
        return;
      }

      const ref = doc(db, "players", playerId);
      unsubscribeDoc = onSnapshot(ref, async (snap) => {
        updateCloudStatus(true);
        if (snap.exists()) {
          const prevCoins = playerData.coins;
          playerData = {
            nickname: playerId,
            coins: 0,
            equippedFrame: "frame_default",
            ownedItems: ["frame_default"],
            logs: [],
            ...snap.data()
          };
          renderAll();
          if (playerData.coins !== prevCoins) {
            bumpCoins();
          }
        } else {
          const initial = {
            nickname: playerId,
            coins: 500,
            equippedFrame: "frame_default",
            ownedItems: ["frame_default"],
            logs: [{ floor: "1F", reason: "建立雲端玩家帳號", delta: 500, time: nowTime() }]
          };
          await setDoc(ref, initial);
        }
      }, () => {
        isOfflineMode = true;
        updateCloudStatus(false);
        loadLocalFallback();
      });
    }

    async function mutateCoins(delta, floorId, reason) {
      if (playerData.coins + delta < 0) {
        alert("金幣不足！先到 1F 領取每日簽到補給，或到其他樓層賺取金幣吧。");
        return false;
      }
      const newLog = { floor: floorId, reason, delta, time: nowTime() };
      const updatedLogs = [newLog, ...(playerData.logs || [])].slice(0, 30);

      if (!db || isOfflineMode) {
        playerData.coins += delta;
        playerData.logs = updatedLogs;
        saveLocalFallback();
        renderAll();
        bumpCoins();
        return true;
      }

      const ref = doc(db, "players", playerId);
      await updateDoc(ref, {
        coins: increment(delta),
        logs: updatedLogs
      });
      return true;
    }

    window.claimDailyBonus = async function () {
      await mutateCoins(100, "1F", "每日簽到領取");
    };

    window.enterFloor = async function (floorId) {
      const floor = FLOORS.find((f) => f.id === floorId);
      if (!floor || !floor.open || !floor.url) return;

      if (floor.entryFee > 0) {
        const ok = await mutateCoins(-floor.entryFee, floor.id, `${floor.name}入場費`);
        if (!ok) return;
      }

      const overlay = document.getElementById("elevatorOverlay");
      document.getElementById("targetFloorLabel").textContent = floor.id;
      overlay.classList.add("active");

      const targetUrl = new URL(floor.url);
      targetUrl.searchParams.set("player", playerId);
      targetUrl.searchParams.set("floor", floor.id);

      setTimeout(() => {
        window.location.href = targetUrl.toString();
      }, 750);
    };

    window.buyOrEquip = async function (itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;

      const owned = (playerData.ownedItems || []).includes(item.id);
      if (!owned) {
        const ok = await mutateCoins(-item.price, "1F", `購買外觀：${item.name}`);
        if (!ok) return;
        const nextOwned = [...new Set([...(playerData.ownedItems || []), item.id])];
        if (!db || isOfflineMode) {
          playerData.ownedItems = nextOwned;
          saveLocalFallback();
          renderAll();
        } else {
          await updateDoc(doc(db, "players", playerId), { ownedItems: nextOwned });
        }
      }

      if (item.type === "frame") {
        if (!db || isOfflineMode) {
          playerData.equippedFrame = item.id;
          saveLocalFallback();
          renderAll();
        } else {
          await updateDoc(doc(db, "players", playerId), { equippedFrame: item.id });
        }
      }
    };

    function bumpCoins() {
      const el = document.getElementById("coinBadge");
      el.classList.add("bump");
      setTimeout(() => el.classList.remove("bump"), 250);
    }

    function renderTower() {
      const col = document.getElementById("floorsColumn");
      col.innerHTML = "";
      const hasFloor2Gold = (playerData.ownedItems || []).includes("floor2_gold");
      const hasFestive = (playerData.ownedItems || []).includes("festive_tower");

      document.getElementById("towerWrapper").classList.toggle("festive", hasFestive);

      FLOORS.forEach((f) => {
        const row = document.createElement("div");
        row.className = "floor-row";
        if (f.id === currentFloorId) row.classList.add("active");
        if (f.id === "2F" && hasFloor2Gold) row.classList.add("floor2-gold");

        row.onclick = () => {
          currentFloorId = f.id;
          renderTower();
          renderInspector();
        };

        row.innerHTML = `
          <div class="floor-left">
            <span class="floor-tag">${f.id}</span>
            <div>
              <div class="floor-title">${f.name}</div>
              <div class="floor-sub">${f.open ? (f.entryFee > 0 ? `入場 ${f.entryFee} 幣 · ${f.rewardHint}` : f.rewardHint) : "尚未開張"}</div>
            </div>
          </div>
          <div class="windows">
            <span class="win ${f.open ? "lit" : ""}"></span>
            <span class="win ${f.open ? "lit" : ""}"></span>
          </div>
        `;
        col.appendChild(row);
      });

      requestAnimationFrame(() => moveElevator(currentFloorId));
    }

    function moveElevator(floorId) {
      const shaft = document.getElementById("elevatorShaft");
      const car = document.getElementById("elevatorCar");
      document.getElementById("elevatorFloorText").textContent = floorId;
      if (!shaft || !car) return;

      const idx = Math.max(0, FLOORS.findIndex((f) => f.id === floorId));
      const total = Math.max(1, FLOORS.length);
      const shaftHeight = shaft.clientHeight;
      const carHeight = car.offsetHeight || 46;
      const pad = 8;
      const usable = Math.max(0, shaftHeight - carHeight - pad * 2);
      // 索引 0 為 1F 在最下方，索引最後為頂樓在最上方
      const ratioFromTop = total === 1 ? 0 : 1 - idx / (total - 1);
      const topPx = pad + usable * ratioFromTop;
      car.style.top = `${Math.round(topPx)}px`;
    }

    window.addEventListener("resize", () => {
      moveElevator(currentFloorId);
    });

    function renderInspector() {
      const floor = FLOORS.find((f) => f.id === currentFloorId) || FLOORS[1];
      document.getElementById("detailFloor").textContent = floor.id;
      document.getElementById("detailTitle").textContent = floor.name;
      document.getElementById("detailDesc").textContent = floor.desc;

      const tagsEl = document.getElementById("detailTags");
      tagsEl.innerHTML = floor.tags.map((t) => `<span class="tag">${t}</span>`).join("");

      const ecoEl = document.getElementById("detailEconomy");
      if (!floor.open) {
        ecoEl.innerHTML = "此樓層目前尚未開放，未來新增小遊戲時會在此顯示入場費與獎勵。";
      } else if (floor.id === "1F") {
        ecoEl.innerHTML = "<strong>大廳補給：</strong>每天可在這裡領取 100 遊戲幣，也能打開外觀商店打扮你的名牌與大樓。";
      } else {
        ecoEl.innerHTML = `<strong>入場費用：</strong>${floor.entryFee} 幣<br/><strong>獎勵機制：</strong>${floor.rewardHint}`;
      }

      const actionsEl = document.getElementById("detailActions");
      actionsEl.innerHTML = "";

      if (floor.id === "1F") {
        const btn = document.createElement("button");
        btn.className = "btn-gold";
        btn.textContent = "🎁 領取簽到 +100 幣";
        btn.onclick = window.claimDailyBonus;
        actionsEl.appendChild(btn);
      } else if (floor.open && floor.url) {
        const btn = document.createElement("button");
        btn.className = "btn-primary";
        btn.textContent = floor.entryFee > 0 ? `🛗 付 ${floor.entryFee} 幣並搭乘電梯前往` : "🛗 搭乘電梯前往";
        btn.onclick = () => window.enterFloor(floor.id);
        actionsEl.appendChild(btn);
      }
    }

    function renderShop() {
      document.getElementById("shopCoins").textContent = playerData.coins;
      const list = document.getElementById("shopList");
      list.innerHTML = "";

      SHOP_ITEMS.forEach((item) => {
        const owned = (playerData.ownedItems || []).includes(item.id);
        const equipped = item.type === "frame" && playerData.equippedFrame === item.id;

        const div = document.createElement("div");
        div.className = "shop-item";
        div.innerHTML = `
          <div>
            <div style="font-weight:700;">${item.name}</div>
            <div style="font-size:0.8rem;color:#94a3b8;">${item.desc}</div>
            <div style="font-size:0.82rem;color:#fbbf24;margin-top:3px;">價格：🪙 ${item.price}</div>
          </div>
        `;

        const btn = document.createElement("button");
        if (equipped) {
          btn.className = "btn-secondary";
          btn.textContent = "已穿戴";
          btn.disabled = true;
        } else if (owned) {
          btn.className = "btn-primary";
          btn.textContent = item.type === "frame" ? "穿戴" : "已啟用";
          btn.disabled = item.type !== "frame";
          btn.onclick = () => window.buyOrEquip(item.id);
        } else {
          btn.className = "btn-gold";
          btn.textContent = "購買";
          btn.onclick = () => window.buyOrEquip(item.id);
        }

        div.appendChild(btn);
        list.appendChild(div);
      });
    }

    function renderWallet() {
      document.getElementById("walletCoins").textContent = playerData.coins;
      const list = document.getElementById("logList");
      const logs = playerData.logs || [];
      if (!logs.length) {
        list.innerHTML = "<p style='color:#94a3b8;font-size:0.85rem;'>尚無收支紀錄</p>";
        return;
      }
      list.innerHTML = logs.map((l) => `
        <div class="log-item">
          <span>[${l.floor}] ${l.reason} <small style="color:#94a3b8;">(${l.time})</small></span>
          <strong style="color:${l.delta >= 0 ? "#34d399" : "#f87171"};">${l.delta >= 0 ? "+" : ""}${l.delta}</strong>
        </div>
      `).join("");
    }

    function renderAll() {
      document.getElementById("playerNameLabel").textContent = playerId;
      document.getElementById("coinBalance").textContent = playerData.coins;

      const badge = document.getElementById("playerBadge");
      badge.className = "player-badge";
      if (playerData.equippedFrame === "frame_gold") badge.classList.add("frame-gold");
      if (playerData.equippedFrame === "frame_neon") badge.classList.add("frame-neon");

      renderTower();
      renderInspector();
      renderShop();
      renderWallet();
    }

    window.openPlayerModal = function () {
      document.getElementById("playerInput").value = playerId;
      document.getElementById("playerModal").classList.add("open");
    };

    window.savePlayerId = function () {
      const val = document.getElementById("playerInput").value.trim().toLowerCase();
      if (!val) return;
      playerId = val;
      localStorage.setItem("gameTower_playerId", playerId);
      closeModal("playerModal");
      subscribePlayer();
    };

    window.openShopModal = function () {
      renderShop();
      document.getElementById("shopModal").classList.add("open");
    };

    window.openWalletModal = function () {
      renderWallet();
      document.getElementById("walletModal").classList.add("open");
    };

    window.closeModal = function (id) {
      document.getElementById(id).classList.remove("open");
    };

    window.toggleDayNight = function () {
      document.body.classList.toggle("day-mode");
    };

    subscribePlayer();
  </script>
</body>
</html>
